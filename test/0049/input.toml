#This is a CREST input file
input='struc1.xyz'
runtype='ancopt'

#parallelization
threads = 4
#calculation data

[calculation]
type = 3   # specify energy & gradient from [calculation.level] to be used
            # -1 is for MECPs

# the two hessians defining the potential is defined here
[[calculation.level]]
method = "ssff"
refgeo = "struc1.xyz"
refhessian = "hess1"
refwbo = "wbo1"
refff = "ff1"
useff = false

[[calculation.level]]
method = "ssff"
refgeo = "struc2.xyz"
refhessian = "hess2"
refwbo = "wbo2"
refff = "ff2"
useff = false

[[calculation.level]]
method = "tsff" 
id1 = 1 
id2 = 2
refff = "tsff"
