[build-system]
requires = [
  "setuptools>=70",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ffits"
version = "0.9.0"
description = "Force Field-interpolated Transition States"
authors = [
  { name = "Daria Babushkina", email = "babushkina@pc.rwth-aachen.de" },
  # { name = "Christoph Bannwarth", email = "bannwarth@pc.rwth-aachen.de" }
]
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "networkx",
  "pandas",
  "scipy>=1.5.0",
  "molbar>=1.2.0",
  "tomli>=1.2.0"
]

readme = "README.md"
license = { text = "BSD-3-Clause" }
keywords = ["force-field", "transition-state", "chemistry"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD-3-Clause",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ffits = "ffits.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ffits*"]

[tool.setuptools.package-data]
"ffits" = [
  "data/*",
  "data/**/*",
  "forcefield/fortran/*.so",
  "forcefield/python_interface/*.py",
  "forcefield/python_interface/**/*.py",
  "bin/*"  
]
