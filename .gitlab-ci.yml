# GitLab CI/CD Pipeline for FFiTS
# Runs tests on merge requests and main branch

stages:
  - test
  - build
  - deploy

variables:
  # Python version for testing
  PYTHON_VERSION: "3.11"
  # Cache pip dependencies
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache configuration
cache:
  paths:
    - .cache/pip/
    - venv/

# Test job - runs on merge requests and main branch
test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  
  # Run on merge requests, main and dev branch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  
  before_script:
    # Install system dependencies
    - apt-get update -qq && apt-get install -y -qq 
        build-essential 
        cmake 
        ninja-build 
        gfortran 
        python3-dev 
        git
    
    # Set up Python environment
    - python -m pip install --upgrade pip
    - python -m venv venv
    - source venv/bin/activate
    
    # Install development dependencies (includes build dependencies)
    - pip install -r requirements-dev.txt
    
    # Build Fortran extensions in-place
    - python setup.py build_ext --inplace
    
    # Install package in editable mode
    - pip install -e .
    
    # Install molbar optimizer from dev branch
    - cd /tmp && git clone https://git.rwth-aachen.de/bannwarthlab/molbar.git
    - cd molbar && git fetch && git checkout dev && make install && cd -
  
  script:
    - source venv/bin/activate
    # Run tests with coverage
    - pytest tests/ -v --tb=short --cov=ffits --cov-report=xml --cov-report=term
  
  
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week
  
  # Allow failure for now during development
  allow_failure: false

