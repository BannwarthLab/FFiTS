[system]
charge = 0
multiplicity = 1

# ============================
# Reactant configuration
# ============================

[reactant.path]
xyz_filename = "struc1.xyz"
wbo_filename = "wbo1"
hessian_filename = "struc1.hess"
ff_filename = "ff1.csv"

[reactant.calculation]
geometry_optimization = false
# If true, a geometry optimization with GFN2-xTB is performed.
wbo_calc = true
# WBO is calculated during runtime. If false, it is read from wbo_filename.
hessian_calc = true
# Hessian is calculated during runtime. If false, it is read from hessian_filename.
ff_parameterization = false
# If false, FF is read from "ff_filename".
test_parameterization = false
# If true, the parameterized FF is used to optimize the input structure and
# the RMSD between reactant and FF-optimized reactant is printed.
#
## some parameters for the FF parameterization
ff_parameterization_maxiteration = 1000
ff_parameterization_stepsize = 0.15
ff_parameterization_threshold = 0.0005 
# the lower the threshold, the more prone to overfitting the model becomes, the higher the less precize it gets
ff_parameterization_constant_repulsion = true
# If set to true, the ff parameters of the repulsive terms are not changed during fitting
ff_parameter_repulsion = 0.01 # starting parameter for the repulsive term in FF 


# ============================
# Product configuration
# ============================

[product.path]
xyz_filename = "struc2.xyz"
wbo_filename = "wbo2"
hessian_filename = "struc2.hess"
ff_filename = "ff2.csv"

[product.calculation]
geometry_optimization = false
wbo_calc = true
hessian_calc = true
ff_parameterization = false
test_parameterization = false
## some parameters for the FF parameterization
ff_parameterization_maxiteration = 1000
ff_parameterization_stepsize = 0.15
ff_parameterization_threshold = 0.0005 
# the lower the threshold, the more prone to overfitting the model becomes, the higher the less precize it gets
ff_parameterization_constant_repulsion = true
# If set to true, the ff parameters of the repulsive terms are not changed during fitting
ff_parameter_repulsion = 0.01 # starting parameter for the repulsive term in FF 


# ============================
# TS Guess calculation
# ============================

[ts_guess_calculation.path]
ff_filename = "tsff.csv"
hessian_filename = "ts.hess"

[ts_guess_calculation.calculation]
factor_reactant = 0.5
factor_product = 0.5
optimizer = "molbar-optimizer"
# Other option: "scipy-optimizer" 
molbar_optimizer_e_tol = 1e-8
molbar_optimizer_x_tol = 1e-3
molbar_optimizer_max_micro_steps = 1
energy_threshold_two_optimizations = 0.15
# the energy threshold for to repeat the optimization from the product if started at reactant was to high. 
perform_two_optimizations = false 
# if true, performs a optimization from reactant and from product with the given input and takes the structure with the lower ff energy.  

# ============================
# Postprocessing
# ============================

[postprocessing]
relaxation = "None"
# Options: "None", "gfn2-xtb", "pbeh-3c"
# Fixes reactive atoms and performs a geometry optimization on chosen theory level.
