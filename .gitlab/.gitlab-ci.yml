# GitLab CI/CD Pipeline for FFiTS
# Runs tests on merge requests and main branch

stages:
  - build
  - test
  - deploy

# build-container
build-python3.11:
  stage: build
  cache:
    key: "python3.11-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  script:
    - mkdir -p containers
    - if [ ! -e "containers/${CONTAINER_NAME}.sif" ] ; then apptainer build containers/${CONTAINER_NAME}.sif .gitlab/recipes/${CONTAINER_NAME}.def ; fi
  tags:
    - shell
  variables:
    CONTAINER_NAME: "python3.11"


# Test job - runs on merge requests and main branch
test:
  stage: test
  cache:
    key: "python3.11-$CI_COMMIT_REF_SLUG"
    paths:
      - containers/
  dependencies:
    - build-python3.11
  variables:
    IMAGE_NAME: ""
    CONTAINER_NAME: "containers/python3.11.sif"
    APPTAINER_EXEC_ARGS: "" 
  tags:
    - cpu
  script:  
    # Install development dependencies (includes build dependencies)
    # Install package in editable mode
    # Install molbar optimizer from dev branch
    - export PYTHON=python3.11
    - export CFLAGS="$(python3.11-config --cflags)"
    - export LDFLAGS="$(python3.11-config --ldflags)"
    - git submodule update --init --recursive
    - python3.11 -m venv venv && source venv/bin/activate
    - make install-dev
    - pip list
    # Run tests
    - python3.11 -m pytest tests/
  artifacts:
    when: on_failure
    paths:
      - tests/test_results/
    expire_in: 1 week

