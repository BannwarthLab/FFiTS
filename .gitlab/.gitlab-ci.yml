stages:
  - build
  - test
  - docs-build
  - docs-deploy

# ---------------------------------------------------------------------------
# Matrix: OS x Compiler x Python
# ---------------------------------------------------------------------------
.matrix: &matrix
  parallel:
    matrix:
      - OS:
          # - "rl9"
          - "rl10"
        COMPILER:
          - "gnu"
          # - "intel2023.2.0"
          # - "intel2025.3.0"
        PYTHON:
          # - "python3.9"
          # - "python3.10"
          # - "python3.11"
          - "python3.12"
          - "python3.13"
          - "python3.14"

.container_vars: &container_vars
  CONTAINER_NAME: "${OS}-${COMPILER}-${PYTHON}"
  APPTAINER_RECIPE: "${OS}-${COMPILER}-${PYTHON}.def"
  APPTAINER_RECIPE_GENERATE_CMD: "python3 .gitlab/generate_recipe.py ${CONTAINER_NAME}"

# ---------------------------------------------------------------------------
# Build stage: build one .sif container per matrix combination
# ---------------------------------------------------------------------------
build-containers:
  stage: build
  <<: *matrix
  variables:
    <<: *container_vars
  script:
    - export CONTAINER_NAME="${OS}-${COMPILER}-${PYTHON}"
    - echo $CONTAINER_NAME
    - python3 .gitlab/generate_recipe.py ${CONTAINER_NAME}
    - /gitlab-runner/build_container.sh ${CONTAINER_NAME}.def
  tags:
    - shell

# ---------------------------------------------------------------------------
# Test stage: run the matrix inside each container via pytest
# ---------------------------------------------------------------------------
test:
  stage: test
  <<: *matrix
  variables:
    <<: *container_vars
  needs:
    - build-containers
  tags:
    - cpu
  script:
    - make install-dev
    - pytest tests/
    
# ---------------------------------------------------------------------------
# Docs stage: build with Sphinx, deploy to GitLab Pages on default branch
# ---------------------------------------------------------------------------
docs-build:
  stage: docs-build
  image: python:3.12-slim
  needs: []
  tags:
    - docker
  script:
    - pip install -r requirements-dev.txt
    - pip install sphinx myst-parser sphinx-rtd-theme
    - pip install .
    - sphinx-build -b html docs docs/_build
  artifacts:
    paths:
      - docs/_build

pages:
  stage: docs-deploy
  needs:
    - docs-build
  tags:
    - shell
  script:
    - mkdir -p public
    - mv docs/_build/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH