stages:
  - build
  - test
  - docs-build
  - docs-deploy

# ---------------------------------------------------------------------------
# Matrix: OS x Compiler x Python
# ---------------------------------------------------------------------------
.matrix: &matrix
  parallel:
    matrix:
      - OS:
          # - "rl9"
          - "rl10"
        COMPILER:
          - "gnu"
          # - "intel2023.2.0"
          # - "intel2025.3.0"
        PYTHON:
          # - "python3.9"
          # - "python3.10"
          # - "python3.11"
          - "python3.12"
          - "python3.13"
          - "python3.14"

.container_vars: &container_vars
  CONTAINER_NAME: "${OS}-${COMPILER}-${PYTHON}"
  APPTAINER_RECIPE: "${OS}-${COMPILER}-${PYTHON}.def"
  APPTAINER_RECIPE_GENERATE_CMD: "python3 .gitlab/generate_recipe.py ${CONTAINER_NAME}"

# ---------------------------------------------------------------------------
# Build stage: build one .sif container per matrix combination
# ---------------------------------------------------------------------------
build-containers:
  stage: build
  <<: *matrix
  variables:
    <<: *container_vars
  script:
    - export CONTAINER_NAME="${OS}-${COMPILER}-${PYTHON}"
    - echo $CONTAINER_NAME
    - python3 .gitlab/generate_recipe.py ${CONTAINER_NAME}
    - /gitlab-runner/build_container.sh ${CONTAINER_NAME}.def
  tags:
    - shell

# ---------------------------------------------------------------------------
# Test stage: run the matrix inside each container via pytest
# ---------------------------------------------------------------------------
test:
  stage: test
  <<: *matrix
  variables:
    <<: *container_vars
  needs:
    - build-containers
  tags:
    - shell
  script:
    - export CONTAINER_NAME="${OS}-${COMPILER}-${PYTHON}"
    # build-containers already built/cached this container on the runner
    # host (build_container.sh's cache lives under /tmp/apptainer-cache,
    # outside the per-job workspace, so it isn't passed as a GitLab
    # artifact). Re-run the same generate+build here to resolve the
    # cached .sif path on THIS job's runner: on a cache hit this is fast
    # and does not rebuild, it just reports where the .sif already is.
    - python3 .gitlab/generate_recipe.py ${CONTAINER_NAME}
    - BUILD_OUTPUT=$(/gitlab-runner/build_container.sh ${CONTAINER_NAME}.def 2>&1)
    - echo "$BUILD_OUTPUT"
    - SIF_PATH=$(echo "$BUILD_OUTPUT" | grep -oE '/[^[:space:]]+\.sif' | tail -n1)
    - |
      if [ -z "$SIF_PATH" ]; then
        echo "Could not determine .sif path from build_container.sh output" >&2
        exit 1
      fi
    - 'echo "Using container: $SIF_PATH"'
    - apptainer exec "$SIF_PATH" bash -c "
        python -m venv venv &&
        source venv/bin/activate &&
        make install-dev &&
        pytest tests/"
  # artifacts:
  #   when: on_failure
  #   paths:
  #     - tests/_failure
  #   expire_in: 1 week

# ---------------------------------------------------------------------------
# Docs stage: build with Sphinx, deploy to GitLab Pages on default branch
# ---------------------------------------------------------------------------
docs-build:
  stage: docs-build
  image: python:3.12-slim
  needs: []
  tags:
    - docker
  script:
    - pip install -r requirements-dev.txt
    - pip install sphinx myst-parser sphinx-rtd-theme
    - pip install .
    - sphinx-build -b html docs docs/_build
  artifacts:
    paths:
      - docs/_build

pages:
  stage: docs-deploy
  needs:
    - docs-build
  tags:
    - shell
  script:
    - mkdir -p public
    - mv docs/_build/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH