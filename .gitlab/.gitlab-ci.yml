# define the 2 stages here
stages:
  - build
  - test
  - building-docs

# Define the matrix for all OS and Python combinations here
.matrix: &matrix
  parallel:
    matrix:
      - OS:
          - "RL9"
          - "RL10"
        PYTHON:
          - "python3.12"
          - "python3.13"
          - "python3.14"

# Container building
build:
  stage: build # Add the correct stage name here
  script:
    - export CONTAINER_NAME="${OS}-${PYTHON}"
    - echo $CONTAINER_NAME
    - mkdir -p containers
    - python3 .gitlab/generate_recipe.py ${CONTAINER_NAME}
    - /gitlab-runner/build_container.sh ${CONTAINER_NAME}.def containers/${CONTAINER_NAME}.sif
  tags:
    - shell # Add the correct tag here
  <<: *matrix

# Define the test job here
# General testing
.test_template: &test_template
  variables:
    CONTAINER_NAME: "${OS}-${PYTHON}"
    APPTAINER_RECIPE: "${OS}-${PYTHON}.def"
    APPTAINER_RECIPE_GENERATE_CMD: "python3 .gitlab/generate_recipe.py ${CONTAINER_NAME}"

# Testing
test:
  <<: [*test_template, *matrix]
  stage: test
  needs:
    - build
  tags:
    - cpu
  script:
    - module load python gnu-compilers compiler make
    - export PYTHON=python3.14
    - export CFLAGS="$(python3.14-config --cflags)"
    - export LDFLAGS="$(python3.14-config --ldflags)"
    - printenv
    - python -m venv venv && source venv/bin/activate
    - make install-dev
    - pip list
    # Run tests
    - pytest tests/

