stages:
  - build
  - test
  - docs-build
  - docs-deploy

# ---------------------------------------------------------------------------
# Matrix: OS x Compiler x Python
# ---------------------------------------------------------------------------
.matrix: &matrix
  parallel:
    matrix:
      - OS:
          - "rl9"
          - "rl10"
        COMPILER:
          - "gnu"
          - "intel2023.2.0"
          - "intel2025.3.0"
        PYTHON:
          - "python3.9"
          - "python3.10"
          - "python3.11"
          - "python3.12"
          - "python3.13"
          - "python3.14"

.container_vars: &container_vars
  CONTAINER_NAME: "${OS}-${COMPILER}-${PYTHON}"
  APPTAINER_RECIPE: "${OS}-${COMPILER}-${PYTHON}.def"

# ---------------------------------------------------------------------------
# Build stage: build one .sif container per matrix combination
# ---------------------------------------------------------------------------
build-containers:
  stage: build
  <<: *matrix
  variables:
    <<: *container_vars
  cache:
    key: "container-$CONTAINER_NAME"
    paths:
      - containers/
  script:
    - mkdir -p containers
    - if [ ! -e "containers/${CONTAINER_NAME}.sif" ]; then
        python3 .gitlab/generate_recipe.py ${CONTAINER_NAME};
        /gitlab-runner/build_container.sh ${APPTAINER_RECIPE} containers/${CONTAINER_NAME}.sif;
      fi
  tags:
    - shell

# ---------------------------------------------------------------------------
# Test stage: run the matrix inside each container via pytest
# ---------------------------------------------------------------------------
test:
  stage: test
  <<: *matrix
  variables:
    <<: *container_vars
  needs:
    - build-containers
  cache:
    key: "container-$CONTAINER_NAME"
    paths:
      - containers/
  tags:
    - cpu
  script:
    - apptainer exec containers/${CONTAINER_NAME}.sif bash -c "
        python -m venv venv &&
        source venv/bin/activate &&
        make install-dev &&
        make test"
  artifacts:
    when: on_failure
    paths:
      - tests/test_results/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Docs stage: build with Sphinx, deploy to GitLab Pages on default branch
# ---------------------------------------------------------------------------
docs-build:
  stage: docs-build
  image: python:3.12-slim
  needs: []
  tags:
    - docker
  script:
    - pip install -r requirements-dev.txt
    - pip install sphinx sphinx-rtd-theme
    - pip install .
    - sphinx-build -b html docs docs/_build
  artifacts:
    paths:
      - docs/_build

pages:
  stage: docs-deploy
  needs:
    - docs-build
  tags:
    - shell
  script:
    - mkdir -p public
    - mv docs/_build/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH